<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Whisk Me Away &middot; Sign In</title>
<meta name="description" content="Whisk Me Away - matcha, whisks and ceremony ware in Kuwait.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400;1,600&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="login">

<main class="auth">
  <section class="auth-card">

    <!-- crest: a whisk cradled by sakura -->
    <svg class="auth-card__crest" viewBox="0 0 100 100" fill="none" stroke="#5B744B"
         stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="50" cy="50" r="42" fill="#F7F1E5" stroke="rgba(91,116,75,.22)"/>
      <path d="M30 38 q3-6 6 0 q3-6 6 0 q3-6 6 0 q3-6 6 0 q3-6 6 0 q3-6 6 0"
            stroke="#799567" stroke-width="1.8"/>
      <path d="M47 60 C43 52 37 44 31 38" stroke="#799567"/>
      <path d="M50 60 V37" stroke="#35522B" stroke-width="2.4"/>
      <path d="M53 60 C57 52 63 44 69 38" stroke="#799567"/>
      <path d="M44 60h12" stroke="#F3BABA" stroke-width="3.4"/>
      <rect x="46" y="61" width="8" height="15" rx="2" stroke="#5B744B" stroke-width="2"/>
      <g stroke="none" fill="#F3BABA">
        <circle cx="24" cy="34" r="3.2"/>
        <circle cx="76" cy="38" r="2.6"/>
        <circle cx="30" cy="70" r="2.2"/>
        <circle cx="72" cy="66" r="3"/>
      </g>
    </svg>

    <p class="auth-card__jp">Ocha</p>
    <h1 class="auth-card__title">Whisk<br><em>Me Away</em></h1>
    <p class="auth-card__sub">Matcha &amp; Ceremony &middot; Kuwait</p>

    <div class="divider">Welcome back</div>

    <form id="loginForm" novalidate>
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="you@example.com" autocomplete="email" required>
        <svg class="field__icon" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="5" width="18" height="14" rx="3"/><path d="M4 7l8 6 8-6"/>
        </svg>
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Your password" autocomplete="current-password" required>
        <svg class="field__icon" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
          <rect x="4" y="10" width="16" height="10" rx="3"/><path d="M8 10V7.5a4 4 0 0 1 8 0V10"/>
        </svg>
      </div>

      <label class="field--check">
        <input type="checkbox" id="remember" checked>
        <span>Keep me signed in</span>
      </label>

      <p class="form-msg" id="msg" role="status" aria-live="polite"></p>

      <button type="submit" class="btn btn--primary btn--full">Log in</button>
    </form>

    <div class="divider">Or continue with</div>

    <div class="oauth">
      <button type="button" class="oauth__btn" data-oauth="google">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path fill="#4285F4" d="M21.6 12.2c0-.7-.06-1.35-.18-2H12v3.8h5.4a4.6 4.6 0 0 1-2 3v2.5h3.2c1.9-1.7 3-4.3 3-7.3z"/>
          <path fill="#34A853" d="M12 22c2.7 0 4.96-.9 6.6-2.4l-3.2-2.5c-.9.6-2.05.95-3.4.95-2.6 0-4.8-1.75-5.6-4.1H3.1v2.6A10 10 0 0 0 12 22z"/>
          <path fill="#FBBC05" d="M6.4 13.95a6 6 0 0 1 0-3.85V7.5H3.1a10 10 0 0 0 0 9l3.3-2.55z"/>
          <path fill="#EA4335" d="M12 5.95c1.47 0 2.79.5 3.83 1.5l2.84-2.84A10 10 0 0 0 3.1 7.5l3.3 2.6C7.2 7.7 9.4 5.95 12 5.95z"/>
        </svg>
        <span>Google</span>
      </button>

      <button type="button" class="oauth__btn" data-oauth="apple">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path fill="currentColor" d="M16.4 12.8c0-2.2 1.8-3.3 1.9-3.3-1-1.5-2.6-1.7-3.2-1.7-1.4-.1-2.7.8-3.3.8-.7 0-1.7-.8-2.8-.8-1.5 0-2.8.8-3.6 2.1-1.5 2.6-.4 6.5 1.1 8.6.7 1 1.6 2.2 2.7 2.2 1.1 0 1.5-.7 2.8-.7s1.6.7 2.8.7c1.1 0 1.9-1 2.6-2.1.8-1.2 1.1-2.3 1.2-2.4 0 0-2.2-.9-2.2-3.4z"/>
          <path fill="currentColor" d="M14.6 6.2c.6-.7 1-1.7.9-2.7-.9 0-2 .6-2.6 1.3-.6.6-1.1 1.6-.9 2.6 1 .1 2-.5 2.6-1.2z"/>
        </svg>
        <span>Apple</span>
      </button>
    </div>

    <!-- sign up sits underneath the login button, as requested -->
    <div class="auth-swap">
      <p>New to the tea room?</p>
      <a class="btn btn--ghost btn--full" href="signup.html" data-link>Create an account</a>
    </div>

  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
