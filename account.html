<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Whisk Me Away &middot; My Account</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400;1,600&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="account">

<div class="page">
  <div class="wrap">
    <div class="acct">

      <!-- ---- her details ---- -->
      <aside class="panel" id="infoPanel">
        <div class="avatar" id="avatar">A</div>
        <h2 class="panel__title" style="text-align:center" id="userName">&nbsp;</h2>
        <p class="panel__jp" style="text-align:center">Watashi no joho</p>
        <dl class="info-list" id="infoList"></dl>

        <button type="button" class="btn btn--ghost btn--full" id="editBtn">Edit details</button>

        <!-- swapped in place of the list above when editing -->
        <form class="edit-form" id="editForm" novalidate hidden>
          <div class="field">
            <label for="edName">Full name</label>
            <input type="text" id="edName" maxlength="80" autocomplete="name">
          </div>
          <div class="field">
            <label for="edPhone">Phone <span class="field__hint">7 or 8 digits</span></label>
            <input type="tel" id="edPhone" inputmode="numeric" maxlength="8"
                   pattern="[0-9]{7,8}" autocomplete="tel">
          </div>
          <div class="field">
            <label for="edArea">Area</label>
            <input type="text" id="edArea" list="areaList" autocomplete="off"
                   placeholder="Start typing, e.g. Salmiya" spellcheck="false">
            <datalist id="areaList"></datalist>
          </div>

          <p class="form-msg" id="edMsg" role="status" aria-live="polite"></p>

          <div class="edit-form__actions">
            <button type="submit" class="btn btn--forest">Save changes</button>
            <button type="button" class="btn btn--ghost" id="cancelEdit">Cancel</button>
          </div>
        </form>
      </aside>

      <!-- ---- her orders ---- -->
      <section>
        <div style="margin-bottom:22px">
          <p class="section__jp">Chumon</p>
          <h2 class="section__title" style="font-size:clamp(28px,4vw,40px)">My <em>orders</em></h2>
        </div>
        <div id="orders"></div>
      </section>

    </div>
  </div>
</div>

<footer class="foot">
  <div class="foot__brand">Whisk Me Away</div>
  <p>Kuwait &middot; Delivery across all governorates &middot; Made with matcha</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script src="js/account.js"></script>
</body>
</html>
