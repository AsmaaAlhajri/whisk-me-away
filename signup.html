<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Whisk Me Away &middot; Create Account</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400;1,600&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="signup">

<main class="auth">
  <section class="auth-card">

    <svg class="auth-card__crest" viewBox="0 0 100 100" fill="none" stroke="#5B744B"
         stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="50" cy="50" r="42" fill="#F7F1E5" stroke="rgba(91,116,75,.22)"/>
      <path d="M50 30c-9 7-11 17-4 23 5 5 14 3 16-4 3-8-3-15-12-19z"
            fill="#F3BABA" stroke="#799567"/>
      <path d="M50 30v23" stroke="#35522B"/>
      <path d="M30 62c8 8 32 8 40 0" stroke="#799567"/>
      <g stroke="none" fill="#F3BABA">
        <circle cx="26" cy="40" r="3"/><circle cx="74" cy="44" r="2.4"/><circle cx="68" cy="72" r="2.8"/>
      </g>
    </svg>

    <p class="auth-card__jp">Hajimemashite</p>
    <h1 class="auth-card__title">Join the<br><em>Tea Room</em></h1>
    <p class="auth-card__sub">Free &middot; Takes one minute</p>

    <div class="divider">Your details</div>

    <form id="signupForm" novalidate>
      <div class="field">
        <label for="name">Full name</label>
        <input type="text" id="name" placeholder="Your name" autocomplete="name" required>
        <svg class="field__icon" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="8.5" r="3.6"/><path d="M4.5 20a7.5 7.5 0 0 1 15 0"/>
        </svg>
      </div>

      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="you@example.com" autocomplete="email" required>
        <svg class="field__icon" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="5" width="18" height="14" rx="3"/><path d="M4 7l8 6 8-6"/>
        </svg>
      </div>

      <div class="field">
        <label for="phone">Phone <span class="field__hint">7 or 8 digits</span></label>
        <input type="tel" id="phone" placeholder="99551122" autocomplete="tel"
               inputmode="numeric" maxlength="8" minlength="7" pattern="[0-9]{7,8}">
        <svg class="field__icon" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
          <rect x="6" y="3" width="12" height="18" rx="3"/><path d="M11 18h2"/>
        </svg>
      </div>

      <div class="field">
        <label for="area">Area in Kuwait</label>
        <!-- a search box: type a few letters and pick from the matches.
             The list itself is filled in by js/auth.js from data.js -->
        <input type="text" id="area" list="areaList" autocomplete="off"
               placeholder="Start typing, e.g. Salmiya" spellcheck="false">
        <datalist id="areaList"></datalist>
        <svg class="field__icon" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="6"/><path d="M15.5 15.5 20 20"/>
        </svg>
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="At least 6 characters" autocomplete="new-password" required>
        <!-- the lock is a button: tap it to read the password for three seconds -->
        <button type="button" class="field__peek" data-peek
                aria-label="Show the password for three seconds">
          <svg class="field__icon" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
            <rect x="4" y="10" width="16" height="10" rx="3"/>
            <path class="lock__shut" d="M8 10V7.5a4 4 0 0 1 8 0V10"/>
            <path class="lock__open" d="M8 10V7.5a4 4 0 0 1 7.9-.6"/>
          </svg>
        </button>
      </div>

      <div class="field">
        <label for="confirm">Confirm password</label>
        <input type="password" id="confirm" placeholder="Type it once more" autocomplete="new-password" required>
        <svg class="field__icon" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 12.5l5 5L20 6.5"/>
        </svg>
      </div>

      <p class="form-msg" id="msg" role="status" aria-live="polite"></p>

      <button type="submit" class="btn btn--primary btn--full">Create account</button>
    </form>

    <div class="auth-swap">
      <p>Already have an account?</p>
      <a class="btn btn--ghost btn--full" href="index.html" data-link>Back to log in</a>
    </div>

  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
